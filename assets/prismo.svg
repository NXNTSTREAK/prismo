<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="0.35" stop-color="#ffd23b"/>
      <stop offset="0.65" stop-color="#3bff8a"/>
      <stop offset="1" stop-color="#3b8cff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#14161b"/>
  <!-- glow ring -->
  <rect x="34" y="16" width="60" height="96" rx="30" fill="none" stroke="url(#rgb)" stroke-width="5" opacity="0.35"/>
  <!-- mouse body -->
  <rect x="38" y="20" width="52" height="88" rx="26" fill="url(#body)" stroke="url(#rgb)" stroke-width="3"/>
  <!-- button split -->
  <path d="M64 20 V54 M38 54 H90" stroke="#0e1014" stroke-width="2.5"/>
  <!-- scroll wheel -->
  <rect x="60" y="30" width="8" height="16" rx="4" fill="url(#rgb)"/>
  <!-- logo light strip -->
  <rect x="52" y="82" width="24" height="5" rx="2.5" fill="url(#rgb)"/>
</svg>
